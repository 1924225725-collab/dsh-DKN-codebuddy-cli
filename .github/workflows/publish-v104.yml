name: Publish v1.0.4 release
on:
  push:
    branches:
      - maintenance/release-v1.0.4-20261106
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          test -f releases/dsh-dkn-codebuddy-cli-1.0.4.tgz
          test -f releases/dsh-dkn-codebuddy-cli-1.0.4.tgz.sha256
          printf '%s\n' 'DSH CodeBuddy CLI 1.0.4' '适配 DSH 0.2.2-rc.1；合并国内版和国际版；237 项自动回归通过。' 'DSH CodeBuddy CLI 1.0.4' 'DSH 0.2.2-rc.1 compatibility; unified regional adapters; 237 automated checks passed.' > /tmp/release-notes.md
          gh release create v1.0.4 releases/dsh-dkn-codebuddy-cli-1.0.4.tgz releases/dsh-dkn-codebuddy-cli-1.0.4.tgz.sha256 --repo "${GITHUB_REPOSITORY}" --target main --title "dsh-DKN-codebuddy cli 1.0.4" --notes-file /tmp/release-notes.md